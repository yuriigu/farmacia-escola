version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: farmacia-escola-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - NODE_ENV=development
      - DATABASE_URL=file:./dev.db
      - JWT_SECRET=farmacia_escola_secret_key_desenvolvimento_2026
      - FRONTEND_URL=http://localhost:3000
    volumes:
      # Monta o código para hot-reload em desenvolvimento
      - ./backend:/app
      # Preserva os node_modules instalados dentro do container
      - /app/node_modules
      # Volume para persistência do banco SQLite
      - backend-prisma-data:/app/prisma
    networks:
      - farmacia-network
    command: >
      sh -c "npx prisma db push &&
             (test -f /app/prisma/.seeded || (npx ts-node src/seed/seed.ts && touch /app/prisma/.seeded)) &&
             npm run dev"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: farmacia-escola-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:3001
      - INTERNAL_API_URL=http://backend:3001
      # Habilita polling de arquivos para garantir hot reload confiável em containers
      - WATCHPACK_POLLING=true
    volumes:
      # Monta o código para hot-reload
      - ./frontend:/app
      # Preserva node_modules e cache de build do Next.js
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    networks:
      - farmacia-network

volumes:
  backend-prisma-data:
    driver: local

networks:
  farmacia-network:
    driver: bridge
